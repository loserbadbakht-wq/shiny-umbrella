name: Arttag Archive

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Tags (space or comma separated, AND semantics, e.g. "yuri blue_eyes")'
        required: true
        type: string
      rating:
        description: 'Rating filter'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - safe
          - questionable
          - explicit
      use_filter:
        description: 'Apply blocked-tag filter list'
        required: true
        default: true
        type: boolean
      max_pages:
        description: 'Max pages to fetch (100 posts per page)'
        required: true
        default: '10'
        type: string
      compression_preset:
        description: '7z preset — images are already compressed; fast ≈ same size as ultra, 30× faster'
        required: true
        default: 'fast'
        type: choice
        options:
          - store
          - fast
          - normal
          - ultra
      keep_raw:
        description: 'Also push uncompressed files (doubles LFS cost — avoid unless needed)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: arttag-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install p7zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full

      - name: Fetch, download, compress
        env:
          TAGS:               ${{ inputs.tags }}
          RATING:             ${{ inputs.rating }}
          USE_FILTER:         ${{ inputs.use_filter }}
          MAX_PAGES:          ${{ inputs.max_pages }}
          COMPRESSION_PRESET: ${{ inputs.compression_preset }}
          KEEP_RAW:           ${{ inputs.keep_raw }}
          KEY:                ${{ secrets.KEY }}
          ID:                 ${{ secrets.ID }}
          PROXY_URL:          'https://shiny-art.ultimatepissofshit.workers.dev'
          FILTER_LIST_URL:    'https://raw.githubusercontent.com/loserbadbakht-wq/shiny-umbrella/refs/heads/SG/src/tags_config.json'
        run: node .github/scripts/arttag-archive.js

      - name: Verify archive size (LFS limits)
        id: size
        run: |
          if [ ! -d archives ]; then
            echo "has_archive=false" >> "$GITHUB_OUTPUT"
            echo "No archives directory."
            exit 0
          fi

          FILES=$(find archives -type f \( -name '*.7z' -o -name '*.7z.*' \) | wc -l)
          if [ "$FILES" -eq 0 ]; then
            echo "has_archive=false" >> "$GITHUB_OUTPUT"
            echo "No archives produced."
            exit 0
          fi
          echo "has_archive=true" >> "$GITHUB_OUTPUT"

          EXCEEDED=0
          while IFS=' ' read -r SIZE FILE; do
            MB=$((SIZE / 1024 / 1024))
            echo "  $FILE — ${MB} MB"
            if [ "$SIZE" -gt 2147483648 ]; then
              echo "::error::$FILE exceeds 2 GB LFS per-file limit (${MB} MB)."
              EXCEEDED=1
            elif [ "$SIZE" -gt 52428800 ]; then
              echo "::warning::$FILE is ${MB} MB (GitHub warns above 50 MB)."
            fi
          done < <(find archives -type f \( -name '*.7z' -o -name '*.7z.*' \) -printf '%s %p\n')
          if [ "$EXCEEDED" -eq 1 ]; then exit 1; fi

          TOTAL=$(find archives -type f \( -name '*.7z' -o -name '*.7z.*' \) -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          TOTAL_MB=$((TOTAL / 1024 / 1024))
          echo "Total archive: ${TOTAL_MB} MB"
          if [ "$TOTAL_MB" -gt 1024 ]; then
            echo "::warning::Total ${TOTAL_MB} MB exceeds the 1 GB free LFS storage tier. You will need paid LFS data packs for push to succeed."
          fi

      - name: Push archive (LFS)
        if: steps.size.outputs.has_archive == 'true'
        env:
          TAGS:   ${{ inputs.tags }}
          RATING: ${{ inputs.rating }}
        run: |
          git lfs install --local
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! grep -q 'archives/' .gitattributes 2>/dev/null; then
            echo 'archives/** filter=lfs diff=lfs merge=lfs -text' >> .gitattributes
            git add .gitattributes
          fi

          git add archives/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          SAFE_TAGS=$(printf '%s' "$TAGS" | tr -s ' \t' '_' | cut -c1-60)
          git commit -m "chore(arttag): archive \"${SAFE_TAGS}\" rating=${RATING}"
          git push
