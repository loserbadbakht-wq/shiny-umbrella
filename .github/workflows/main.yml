name: Deploy and Keep Bot Alive

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Run every 5 minutes to keep bot alive
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  # Job 1: Keep bot alive (runs every 5 minutes)
  keep-alive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Ping Render Service
        run: |
          RENDER_URL="${{ secrets.RENDER_URL }}"
          
          if [ -z "$RENDER_URL" ]; then
            echo "⚠️ RENDER_URL not set, skipping ping"
            exit 0
          fi
          
          echo "🔄 Pinging $RENDER_URL to keep it awake..."
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$RENDER_URL" || echo "failed")
          
          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "301" ] || [ "$RESPONSE" = "302" ]; then
            echo "✅ Service is awake! (HTTP $RESPONSE)"
          else
            echo "⚠️ Service responded with HTTP $RESPONSE"
          fi
          
          echo "⏰ Last ping: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

  # Job 2: Deploy (only runs on push to main)
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create .env file from GitHub Secrets
        run: |
          echo "BOT_TOKEN=${{ secrets.BOT_TOKEN }}" > .env
          echo "DB_ENCRYPTION_KEY=${{ secrets.DB_ENCRYPTION_KEY }}" >> .env
          echo "PYTHONUNBUFFERED=1" >> .env
      
      - name: Test bot startup
        run: |
          python bot.py &
          sleep 5
          pkill -f bot.py || true
      
      - name: Deploy to Render
        if: github.ref == 'refs/heads/main'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "⚠️ No RENDER_API_KEY set, skipping Render deployment"
            exit 0
          fi
          
          echo "🚀 Deploying to Render..."
          curl -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"serviceId": "'$RENDER_SERVICE_ID'"}' \
            https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys
      
      - name: Deployment Status
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
            exit 1
          fi
