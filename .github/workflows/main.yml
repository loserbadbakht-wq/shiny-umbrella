name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - sca
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Install Wrangler
        run: npm install -g wrangler
      
      - name: Deploy to Cloudflare Workers
        run: |
          wrangler deploy \
            --var BOT_TOKEN:${{ secrets.SIX_BOT_TOKEN }} \
            --var DB_ENCRYPTION_KEY:${{ secrets.DB_ENCRYPTION_KEY }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      
      - name: Set Webhook
        run: |
          WORKER_URL="https://shiny-scam.${{ secrets.CLOUDFLARE_USERNAME }}.workers.dev"
          curl -sS -f -X POST "https://api.telegram.org/bot${{ secrets.SIX_BOT_TOKEN }}/setWebhook" \
            -H "Content-Type: application/json" \
            -d "{
              \"url\": \"${WORKER_URL}\",
              \"allowed_updates\": [
                \"message\",
                \"edited_message\",
                \"channel_post\",
                \"edited_channel_post\",
                \"callback_query\",
                \"message_reaction\"
              ],
              \"drop_pending_updates\": false
            }"
          echo ""
      
      - name: Verify Webhook
        run: |
          INFO=$(curl -sS -f "https://api.telegram.org/bot${{ secrets.SIX_BOT_TOKEN }}/getWebhookInfo")
          echo "$INFO"
          echo ""
          if echo "$INFO" | grep -q '"message_reaction"'; then
            echo "✅ message_reaction is enabled"
          else
            echo "❌ message_reaction is NOT in allowed_updates"
            exit 1
          fi
      
      - name: Verify Deployment
        run: |
          echo "✅ Deployment successful!"
          echo "🔗 Worker URL: https://shiny-scam.${{ secrets.CLOUDFLARE_USERNAME }}.workers.dev"
