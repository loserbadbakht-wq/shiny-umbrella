name: Reset Cloudflare Worker

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Install Wrangler
        run: npm install -g wrangler
      
      - name: Delete Existing Worker
        run: |
          echo "🗑️ Deleting Worker: shiny-umbrella..."
          wrangler delete || echo "⚠️ Worker may not exist, continuing..."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      
      - name: Deploy Worker
        run: |
          echo "🚀 Deploying Worker..."
          wrangler deploy \
            --var BOT_TOKEN:${{ secrets.BOT_TOKEN }} \
            --var DB_ENCRYPTION_KEY:${{ secrets.DB_ENCRYPTION_KEY }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      
      - name: Set Webhook
        run: |
          WORKER_URL="https://shiny-umbrella.${{ secrets.CLOUDFLARE_USERNAME }}.workers.dev"
          echo "🔗 Setting webhook to: ${WORKER_URL}"
          curl -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/setWebhook?url=${WORKER_URL}"
      
      - name: Verify Deployment
        run: |
          echo "✅ Reset complete!"
          echo "🔗 Worker URL: https://shiny-umbrella.${{ secrets.CLOUDFLARE_USERNAME }}.workers.dev"
