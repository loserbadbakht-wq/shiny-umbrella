name = "shiny-dice"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]

# Language preferences per chat
[[kv_namespaces]]
binding = "BOT_KV"
id = "6557edccf1b0459d883e5fe815b619ce"
