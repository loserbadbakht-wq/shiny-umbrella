name = "shiny-rss"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ─── KV namespace for subscriptions, errors, telemetry ───
[[kv_namespaces]]
binding = "BOT_KV"
id = "62f527eb75de40f5b0f49384b3d741ea"

# ─── Cron: check every feed every 5 minutes ───
[triggers]
crons = ["*/5 * * * *"]

# ─── Non-secret config ───
[vars]
# Telegram user id that receives error DMs and can use /debug & /errors.
# Put your numeric user id here.
OWNER_ID = "302287170"

# ─── Observability ───
[observability]
enabled = true
head_sampling_rate = 1
