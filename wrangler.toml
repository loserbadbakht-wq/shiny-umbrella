name = "shiny-art"
main = "src/index.js"
compatibility_date = "2024-09-01"

[triggers]
crons = ["*/10 * * * *"]   # every 10 minutes

# Create the KV namespace with:
#   wrangler kv:namespace create GELBOORU_KV
# Then paste the id below.
[[kv_namespaces]]
binding = "GELBOORU_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
