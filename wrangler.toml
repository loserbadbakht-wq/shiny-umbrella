name = "shiny-scam"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["30 20 * * *", "30 * * * *", "*/5 * * * *"]

[observability]
enabled = true

[[kv_namespaces]]
binding = "BOT_KV"
id = "d97a738c46a74230bc7bbb597956bee5"

[[durable_objects.bindings]]
name = "BTN_COUNTER"
class_name = "ButtonCounter"

[[durable_objects.bindings]]
name = "GAME_COUNTER"
class_name = "GameCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ButtonCounter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GameCounter"]
