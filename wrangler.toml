name = "shiny-scam"
main = "src/index.js"
compatibility_date = "2024-01-01"

# 00:00 Iran time (UTC+3:30) = 20:30 UTC → cron runs in UTC
[triggers]
crons = ["30 20 * * *"]

# KV namespace to remember which topic to send to
[[kv_namespaces]]
binding = "BOT_KV"
